<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Gara Auto Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <div class="bg-dark text-white p-3 vh-100" style="width: 250px;">
            <h3 class="border-bottom pb-2"><i class="bi bi-car-front"></i> Gara Manager</h3>
            <ul class="nav flex-column mt-3">
                <li class="nav-item"><a href="/" class="nav-link text-white"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
                <li class="nav-item"><a href="/customers/" class="nav-link text-white"><i class="bi bi-people"></i> Khách hàng</a></li>
                <li class="nav-item"><a href="/orders/new/" class="nav-link text-white"><i class="bi bi-tools"></i> Lập lệnh sửa chữa</a></li>
                {% if request.user.groups.all.0.name == 'ThuKho' or request.user.is_superuser %}
<li class="nav-item">
    <a class="nav-link" href="{% url 'inventory' %}">
        <i class="fas fa-boxes"></i>
        <span>Kho Linh Kiện</span>
    </a>
</li>
{% endif %}
                <li class="nav-item"><a href="/admin/" class="nav-link text-white"><i class="bi bi-gear"></i> Cấu hình hệ thống</a></li>
            </ul>
        </div>
        <!-- Main Content -->
        <div class="flex-grow-1 bg-light p-4">
            {% block content %}{% endblock %}
        </div>
    </div>
</body>
</html>
